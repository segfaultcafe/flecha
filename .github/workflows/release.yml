name: Publish release bundles

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version tag on release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use the form vX.Y.Z" >&2
            exit 1
          fi
          git fetch origin release
          tag_commit="$(git rev-parse 'HEAD^{commit}')"
          release_commit="$(git rev-parse 'origin/release^{commit}')"
          if [[ "$tag_commit" != "$release_commit" ]]; then
            echo "Release tag must point to the current release head" >&2
            echo "tag:     $tag_commit" >&2
            echo "release: $release_commit" >&2
            exit 1
          fi

  build-vscode-extension:
    name: Build VS Code extension
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked extension dependencies
        run: npm ci --prefix editors/vscode --ignore-scripts

      - name: Build VSIX
        run: npm run --prefix editors/vscode package

      - name: Verify release VSIX
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          packages=(editors/vscode/flecha-language-*.vsix)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected one VSIX, found ${#packages[@]}" >&2
            exit 1
          fi
          cmake \
            "-DVSIX=$PWD/${packages[0]}" \
            "-DEDITOR_ROOT=$PWD/editors/vscode" \
            "-DOUTPUT_ROOT=$PWD/build-vsix-contents" \
            "-DEXPECTED_VERSION=$version" \
            -P cmake/verify_vsix.cmake

      - name: Create VSIX checksum
        working-directory: editors/vscode
        run: >-
          cmake -E sha256sum flecha-language-*.vsix
          > flecha-language.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: release-vscode-extension
          path: |
            editors/vscode/flecha-language-*.vsix
            editors/vscode/flecha-language.sha256
          if-no-files-found: error

  build-release:
    name: Build release (${{ matrix.name }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            suffix: ""
            llvm_major: 18
            compiler_family: Clang
            compiler_major: 18
            xcode_version: ""
            sdk_major: ""
          - os: windows-2025
            name: windows-x86_64
            suffix: .exe
            llvm_major: 23
            compiler_family: Clang
            compiler_major: 23
            xcode_version: ""
            sdk_major: ""
          - os: macos-15-intel
            name: macos-x86_64
            suffix: ""
            llvm_major: 18
            compiler_family: Clang
            compiler_major: 18
            xcode_version: "16.4"
            sdk_major: 15
          - os: macos-15
            name: macos-arm64
            suffix: ""
            llvm_major: 18
            compiler_family: Clang
            compiler_major: 18
            xcode_version: "16.4"
            sdk_major: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM development files (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-llvm

      - name: Install LLVM development files (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-${{ matrix.compiler_major }} \
            llvm-${{ matrix.llvm_major }}-dev \
            ninja-build
          echo "LLVM_DIR=$(/usr/bin/llvm-config-${{ matrix.llvm_major }} --cmakedir)" >> "$GITHUB_ENV"
          echo "FLECHA_C_COMPILER=/usr/bin/clang-${{ matrix.compiler_major }}" >> "$GITHUB_ENV"
          echo "FLECHA_CXX_COMPILER=/usr/bin/clang++-${{ matrix.compiler_major }}" >> "$GITHUB_ENV"
          echo "FLECHA_LLVM_CONFIG=/usr/bin/llvm-config-${{ matrix.llvm_major }}" >> "$GITHUB_ENV"

      - name: Select LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          llvm_prefix="$(brew --prefix llvm@${{ matrix.llvm_major }})"
          xcode_root="/Applications/Xcode_${{ matrix.xcode_version }}.app/Contents/Developer"
          test -d "$xcode_root"
          echo "$llvm_prefix/bin" >> "$GITHUB_PATH"
          echo "DEVELOPER_DIR=$xcode_root" >> "$GITHUB_ENV"
          echo "LLVM_DIR=$llvm_prefix/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "FLECHA_C_COMPILER=$llvm_prefix/bin/clang" >> "$GITHUB_ENV"
          echo "FLECHA_CXX_COMPILER=$llvm_prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "FLECHA_LLVM_CONFIG=$llvm_prefix/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Select LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64'
          $cmakePrefix = $prefix -replace '\\', '/'
          if (!(Test-Path "$prefix\lib\cmake\llvm\LLVMConfig.cmake")) {
            throw 'MSYS2 LLVM ${{ matrix.llvm_major }} development files were not installed'
          }
          "$prefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LLVM_DIR=$cmakePrefix/lib/cmake/llvm" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLECHA_C_COMPILER=$cmakePrefix/bin/clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLECHA_CXX_COMPILER=$cmakePrefix/bin/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLECHA_LLVM_CONFIG=$cmakePrefix/bin/llvm-config.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Report and verify the release-build toolchain
        shell: bash
        run: >-
          cmake
          "-DPOLICY_ROOT=$PWD/cmake"
          "-DCXX_COMPILER=$FLECHA_CXX_COMPILER"
          "-DEXPECTED_CXX_FAMILY=${{ matrix.compiler_family }}"
          "-DEXPECTED_CXX_MAJOR=${{ matrix.compiler_major }}"
          "-DPLATFORM=${{ runner.os }}"
          "-DLLVM_CONFIG=$FLECHA_LLVM_CONFIG"
          "-DEXPECTED_LLVM_MAJOR=${{ matrix.llvm_major }}"
          "-DEXPECTED_XCODE_VERSION=${{ matrix.xcode_version }}"
          "-DEXPECTED_SDK_MAJOR=${{ matrix.sdk_major }}"
          -P cmake/verify_toolchain.cmake

      - name: Configure release build
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DBUILD_TESTING=OFF
          -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_C_COMPILER=${FLECHA_C_COMPILER:-clang}"
          "-DCMAKE_CXX_COMPILER=${FLECHA_CXX_COMPILER:-clang++}"
          "-DLLVM_DIR=$LLVM_DIR"

      - name: Build
        run: cmake --build build --parallel

      - name: Verify tag and component versions
        shell: bash
        run: >-
          cmake
          "-DFLECHA_COMPILER=$PWD/build/flecha${{ matrix.suffix }}"
          "-DRELEASE_TAG=${{ github.event.release.tag_name }}"
          "-DSOURCE_ROOT=$PWD"
          -P cmake/verify_release.cmake

      - name: Native compiler and Longbow smoke test
        shell: bash
        run: >-
          cmake
          "-DFLECHA_COMPILER=$PWD/build/flecha${{ matrix.suffix }}"
          "-DLONGBOW=$PWD/build/longbow${{ matrix.suffix }}"
          "-DOUTPUT_ROOT=$PWD/build/release-smoke"
          "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}"
          -P cmake/release_smoke.cmake

      - name: Build release archives
        run: cmake --build build --target package

      - name: Verify installed layout
        shell: bash
        run: |
          cmake --install build --prefix "$PWD/build/stage"
          cmake \
            "-DINSTALL_ROOT=$PWD/build/stage" \
            "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}" \
            -P cmake/verify_bundle.cmake
          cmake \
            "-DFLECHA_COMPILER=$PWD/build/stage/bin/flecha${{ matrix.suffix }}" \
            "-DLONGBOW=$PWD/build/stage/bin/longbow${{ matrix.suffix }}" \
            "-DOUTPUT_ROOT=$PWD/build/installed-smoke" \
            "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}" \
            -P cmake/release_smoke.cmake

      - name: Create checksums
        shell: bash
        run: |
          cd build
          cmake -E sha256sum flecha-*.tar.gz flecha-*.zip \
            > "flecha-${{ matrix.name }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            build/flecha-*.tar.gz
            build/flecha-*.zip
            build/flecha-${{ matrix.name }}.sha256
          if-no-files-found: error

  clean-install-support:
    name: Prepare clean-install test support
    needs: validate-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-artifact@v4
        with:
          name: clean-install-support
          path: |
            cmake/release_smoke.cmake
            cmake/toolchain_policy.cmake
            cmake/verify_bundle.cmake
            cmake/verify_toolchain.cmake
          if-no-files-found: error

  clean-install:
    name: Clean install (${{ matrix.name }})
    needs:
      - build-release
      - clean-install-support
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            suffix: ""
            archive_suffix: .tar.gz
            compiler_family: Clang
            compiler_major: 18
            xcode_version: ""
            sdk_major: ""
          - os: windows-2025
            name: windows-x86_64
            suffix: .exe
            archive_suffix: .zip
            compiler_family: Clang
            compiler_major: 23
            xcode_version: ""
            sdk_major: ""
          - os: macos-15-intel
            name: macos-x86_64
            suffix: ""
            archive_suffix: .tar.gz
            compiler_family: AppleClang
            compiler_major: 17
            xcode_version: "16.4"
            sdk_major: 15
          - os: macos-15
            name: macos-arm64
            suffix: ""
            archive_suffix: .tar.gz
            compiler_family: AppleClang
            compiler_major: 17
            xcode_version: "16.4"
            sdk_major: 15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install host linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils clang-${{ matrix.compiler_major }} libc6-dev
          echo "FLECHA_HOST_CXX=/usr/bin/clang++-${{ matrix.compiler_major }}" >> "$GITHUB_ENV"

      - name: Install host linker (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-clang

      - name: Add the Windows host linker to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'ucrt64\bin'
          $prefix | Out-File -FilePath $env:GITHUB_PATH -Append
          $cmakePrefix = $prefix -replace '\\', '/'
          "FLECHA_HOST_CXX=$cmakePrefix/clang++.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Select the macOS host linker and SDK
        if: runner.os == 'macOS'
        run: |
          xcode_root="/Applications/Xcode_${{ matrix.xcode_version }}.app/Contents/Developer"
          test -d "$xcode_root"
          echo "DEVELOPER_DIR=$xcode_root" >> "$GITHUB_ENV"
          echo "FLECHA_HOST_CXX=/usr/bin/clang++" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: clean-install-support
          path: test-support

      - name: Report and verify the clean-install toolchain
        shell: bash
        run: >-
          cmake
          "-DPOLICY_ROOT=$PWD/test-support"
          "-DCXX_COMPILER=$FLECHA_HOST_CXX"
          "-DEXPECTED_CXX_FAMILY=${{ matrix.compiler_family }}"
          "-DEXPECTED_CXX_MAJOR=${{ matrix.compiler_major }}"
          "-DPLATFORM=${{ runner.os }}"
          "-DEXPECTED_XCODE_VERSION=${{ matrix.xcode_version }}"
          "-DEXPECTED_SDK_MAJOR=${{ matrix.sdk_major }}"
          -P test-support/verify_toolchain.cmake

      - name: Extract and relocate the release archive
        shell: bash
        env:
          ARCHIVE_SUFFIX: ${{ matrix.archive_suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(package/flecha-*"$ARCHIVE_SUFFIX")
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected one $ARCHIVE_SUFFIX archive, found ${#archives[@]}" >&2
            exit 1
          fi
          mkdir unpacked relocated
          (
            cd unpacked
            cmake -E tar xf "../${archives[0]}"
          )
          bundles=(unpacked/flecha-*/)
          if [[ ${#bundles[@]} -ne 1 ]]; then
            echo "Expected one extracted bundle, found ${#bundles[@]}" >&2
            exit 1
          fi
          mv "${bundles[0]}" relocated/flecha
          echo "FLECHA_BUNDLE=$PWD/relocated/flecha" >> "$GITHUB_ENV"

      - name: Verify bundled runtime dependencies
        shell: bash
        run: >-
          cmake
          "-DINSTALL_ROOT=$FLECHA_BUNDLE"
          "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}"
          -P test-support/verify_bundle.cmake

      - name: Exercise the relocated installation
        shell: bash
        run: >-
          cmake
          "-DFLECHA_COMPILER=$FLECHA_BUNDLE/bin/flecha${{ matrix.suffix }}"
          "-DLONGBOW=$FLECHA_BUNDLE/bin/longbow${{ matrix.suffix }}"
          "-DOUTPUT_ROOT=$PWD/clean-install-smoke"
          "-DEXECUTABLE_SUFFIX=${{ matrix.suffix }}"
          -P test-support/release_smoke.cmake

  publish-assets:
    name: Attach bundles to GitHub Release
    needs:
      - clean-install
      - build-vscode-extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release-assets/*.sha256 | sort > release-assets/SHA256SUMS
          gh release upload \
            "${{ github.event.release.tag_name }}" \
            release-assets/*.tar.gz \
            release-assets/*.zip \
            release-assets/*.vsix \
            release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
